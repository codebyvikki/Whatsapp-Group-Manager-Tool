<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacts and Groups</title>
<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,"Microsoft YaHei",sans-serif;
    background:#eef2f6;
    color:#222;
}
.title{
    display:block;
    width:100%;
    text-align:center;
    font-family:"Segoe UI", Arial, sans-serif;
    font-size:30px;
    font-weight:700;
    letter-spacing:0.4px;
    color:#1f2937;
    margin:5px 0 16px;
    line-height:1.2;
    border:0;
    outline:0;
    background:transparent;
    padding:0;
}

.stats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:18px;
    margin-bottom:16px;
    align-items:flex-start;
}

.stats > .stat:not(.profile){
    position:relative;
    top:29px;
}

.stat{
    min-width:155px;
    height:62px;

    border:1px solid #e2e8f0;
    border-radius:12px;

    background:#ffffff;

    padding:11px 16px;

    box-shadow:
        0 3px 12px rgba(15,23,42,.06);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}

.stat:hover{
    transform:translateY(-2px);

    box-shadow:
        0 7px 20px rgba(15,23,42,.10);

    border-color:#d6dde6;
}
.label{
    font-size:12px;
    font-weight:500;
    color:#64748b;
    letter-spacing:.2px;
}

.value{
    font-size:23px;
    font-weight:700;
    color:#111827;
    margin-top:5px;
    line-height:1;
}
.country input{
    width:110px;
    min-width:40px;
    border:0;
    font-size:18px;
    font-weight:700;
    color:#111827;
    outline:0;
    background:transparent;
    padding:0;
    margin-top:4px;
}
/* PROFILE */
.profile{
    margin-left:auto;

    width:max-content;
    min-width:200px;
    max-width:520px;

    height:80px;

    padding:10px 16px;

    position:relative;
    top:10px;

    border:1px solid #e1e7ef;
    border-radius:14px;

    background:#ffffff;

    box-shadow:
        0 4px 16px rgba(15,23,42,.07);

    display:flex;
    flex-direction:column;
    justify-content:center;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.profile:hover{
    transform:translateY(-2px);

    box-shadow:
        0 8px 24px rgba(15,23,42,.11);
}

.profile-content{
    display:flex;
    align-items:center;
    gap:9px;
    height:56px;
    width:max-content;
    max-width:100%;
    min-width:0;
}
/* Round Upload Logo button */
.profile-logo{
    width:42px;
    height:42px;
    flex:0 0 42px;

    border:0;
    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    cursor:pointer;

    color:#666;
    font-size:10px;
    line-height:11px;
    text-align:center;
}

/* TOP NAVIGATION */
.tag-page-top{
    width:100%;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.tag-nav-btn{
    border:1px solid #d7dee7;
    background:#fff;
    color:#1f2937;
    border-radius:8px;
    padding:8px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(15,23,42,.06);
    text-decoration:none;
}
.tag-nav-btn:hover{
    background:#3575b9;
    color:#fff;
    border-color:#3575b9;
}

/* SERVER-SAVED TAG BACKUPS */
.backup-panel{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1px solid #dfe5ec;
    border-radius:10px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    box-shadow:0 3px 12px rgba(15,23,42,.04);
}
.backup-panel select{
    height:34px;
    min-width:220px;
    max-width:100%;
    border:1px solid #bbb;
    border-radius:4px;
    padding:0 9px;
    background:#fff;
}
.backup-panel .backup-label{
    font-size:13px;
    font-weight:700;
    color:#475569;
}
.backup-panel .backup-status{
    font-size:12px;
    color:#64748b;
    margin-left:auto;
}
.backup-save{background:#0a8f4a}
.backup-delete{background:#d9534f}
.saved-backup-cards{display:grid;gap:10px;margin:12px 0 4px}.saved-card{border:1px solid #dfe7e2;background:#fbfdfc;border-radius:12px;padding:13px 14px;display:grid;gap:9px}.saved-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.saved-card-head strong{font-size:.92rem}.saved-meta{color:#66736c;font-size:.76rem;margin-top:2px}.saved-dot{color:#128c55;font-size:.74rem;font-weight:800;white-space:nowrap}.saved-preview{color:#66736c;font-size:.78rem;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-card-actions{display:flex;gap:8px;flex-wrap:wrap}.saved-card-actions .btn{min-height:34px;padding:7px 12px}.saved-empty{padding:12px 14px;border:1px dashed #dfe7e2;border-radius:11px;color:#66736c;font-size:.8rem;background:#fbfdfc}
@media(max-width:700px){
    .backup-panel .backup-status{width:100%;margin-left:0}
    .backup-panel select{flex:1;min-width:160px}
}

#downloadArea{
    width:100%;
    background:#ffffff;
    border:1px solid #e1e6eb;
    border-radius:18px;
    padding:22px;
    box-shadow:
        0 8px 30px rgba(15,23,42,.08);
}

/* Uploaded logo */
.profile-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

/* Hide Choose File completely */
.profile-logo input[type="file"]{
    display:none;
}

/* Profile Name */
#profileName{
    font-size:21px;
    font-weight:bold;
    color:#000;
    white-space:nowrap;
    max-width:420px;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
}


.color-btn{
    background:#e67e22;
}

.profile-text{
    display:flex;
    flex-direction:column;
    justify-content:center;
    flex:0 1 auto;
    min-width:0;
    max-width:420px;
    overflow:hidden;
}

#profileTagline{
    font-size:10px;
    font-weight:500;
    color:#666;
    margin-top:2px;
    white-space:nowrap;
    max-width:420px;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
}

/* Edit button */
.profile button{
    border:0;
    background:transparent;
    color:#3575b9;
    cursor:pointer;
    font-size:16px;
    padding:3px 5px;
}
.panel{
    border:1px solid #e1e6eb;
    border-radius:14px;

    padding:12px;

    min-height:350px;

    background:#ffffff;

    box-shadow:
        0 4px 18px rgba(15,23,42,.06);

    overflow:visible;
}
.toolbar{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap}.toolbar input,.toolbar select{height:31px;border:1px solid #bbb;border-radius:3px;padding:0 8px}.toolbar input{flex:1;min-width:180px}
/* GROUP TAG AREA */
.tags{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-start;
    justify-content:center;
    gap:10px;
    padding:12px;
    background:#fff;
}

/* EACH GROUP TAG */
.tag{
    display:inline-flex;
    align-items:center;

    width:max-content;
    max-width:100%;
    min-width:0;

    height:38px;

    background:#006b3c;
    color:#fff;

    border-radius:7px;
    padding:0;

    font-size:15px;
    white-space:nowrap;

    overflow:visible;
    cursor:pointer;

    flex:0 0 auto;
}

/* GROUP NAME SECTION */
.tag-name{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    height:34px;
    padding:0 9px;
    flex:0 1 auto;
    min-width:0;
    white-space:nowrap;
    line-height:1;
    font-size:20px;
    font-weight:700;
    font-family:Arial, "Microsoft YaHei", sans-serif;
    -webkit-text-stroke:0.15px currentColor;
}
/* MEMBERS SECTION — OLD ROUND/PILL STYLE */
.members{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    height:24px;
    font-size:14px;
    font-weight:700;
    background:#ffffff2b;
    padding:1px 6px;
    margin-left:3px;
    border-radius:999px;
    white-space:nowrap;
}

/* SEPARATE X SECTION */
.tag button{
    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 29px;
    width:29px;
    min-width:29px;
    max-width:29px;

    height:38px;

    margin-left:3px;

    border:0;
    border-left:2px solid #fff;

    background:transparent;
    color:#fff;

    cursor:pointer;

    font-size:16px;
    line-height:1;

    padding:0;
}



.tag button:hover{
    background:rgba(0,0,0,.12);
}
.controls{margin-top:10px;display:flex;gap:8px}.btn{border:0;border-radius:3px;color:#fff;padding:7px 13px;cursor:pointer;font-size:14px}.save,.add{background:#0a8f4a}.clear{background:#d9534f}.blue{background:#3575b9}
.addrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.addrow input{height:34px;border:1px solid #bbb;border-radius:3px;padding:0 9px}.name{width:330px}.num{width:140px}.status{font-size:13px;color:#666;min-height:18px;margin-top:7px}
.modalbg{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;padding:18px;border-radius:6px;width:min(430px,100%)}.modal h3{margin:0 0 12px}.modal label{display:block;font-size:13px;margin:8px 0 4px}.modal input{width:100%;height:35px;padding:0 9px;border:1px solid #bbb;border-radius:3px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.download{
    background:#3575b9;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:12px;
}

.modal-header h3{
    margin:0;
}

/* INDIVIDUAL TAG COLOR PICKER */

.edit-color-picker{
    position:relative;
}

.edit-color-btn{
    background:#e67e22;
}

.edit-color-palette{
    display:none;

    position:absolute;

    top:38px;
    right:0;

    z-index:2000;

    width:190px;

    padding:10px;

    background:#fff;

    border:1px solid #d5d5d5;

    border-radius:8px;

    box-shadow:0 5px 18px rgba(0,0,0,.18);

    grid-template-columns:repeat(5, 28px);

    gap:8px;

    justify-content:center;
}

.edit-color-option{
    width:28px;
    height:28px;

    padding:0;

    border:2px solid #fff;

    border-radius:50%;

    cursor:pointer;

    box-shadow:0 0 0 1px #ccc;

    position:relative;
}

.edit-color-option:hover{
    transform:scale(1.12);
}

.edit-color-option.selected{
    box-shadow:
        0 0 0 2px #222,
        0 0 0 4px #fff;
}

.edit-custom-color{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px dashed #999;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:#fff;
    position:relative;
    font-size:18px;
    line-height:1;
    color:#555;
    box-sizing:border-box;
    padding:0;
}

.edit-custom-color span{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    line-height:1;
    margin:0;
    padding:0;
    transform:translateY(-1px);
}


.edit-custom-color:hover{
    background:#f3f3f3;
}

.edit-custom-color input{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    opacity:0;

    cursor:pointer;
}

/* TAG COLOR PALETTE */

.color-picker-wrap{
    position:relative;
    margin-left:auto;
}

.color-palette{
    display:none;

    position:absolute;

    top:42px;
    right:0;

    z-index:1000;

    width:190px;

    padding:10px;

    background:#fff;

    border:1px solid #d5d5d5;

    border-radius:8px;

    box-shadow:0 5px 18px rgba(0,0,0,.18);

    grid-template-columns:repeat(5, 28px);

    gap:8px;

    justify-content:center;
}

.color-option{
    width:28px;
    height:28px;

    padding:0;

    border:2px solid #fff;

    border-radius:50%;

    cursor:pointer;

    box-shadow:0 0 0 1px #ccc;

    position:relative;
}

.color-option:hover{
    transform:scale(1.12);
}

.color-option.selected{
    box-shadow:
        0 0 0 2px #222,
        0 0 0 4px #fff;
}

.custom-color-option{
    width:28px;
    height:28px;

    border-radius:50%;

    border:2px dashed #999;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    background:#fff;

    position:relative;

    font-size:18px;
    color:#555;
}

.custom-color-option:hover{
    background:#f3f3f3;
}

.custom-color-option input{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    opacity:0;

    cursor:pointer;
}


/* =========================================================
   MOBILE FIT / PHONE LAYOUT
   Keep the desktop design intact; only reflow fixed-width pieces
   so the page never requires desktop mode or horizontal scrolling.
   ========================================================= */
@media(max-width:700px){
    body{
        padding:12px 10px 28px;
        overflow-x:hidden;
    }

    .title{
        font-size:24px;
        margin:3px 0 13px;
    }

    .stats{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:9px;
        margin-top:10px;
        margin-bottom:12px;
    }

    .stats > .stat:not(.profile){
        top:0;
    }

    .stat{
        min-width:0;
        width:100%;
        height:auto;
        min-height:58px;
        padding:10px 12px;
    }

    .profile{
        grid-column:1/-1;
        margin-left:0;
        top:0;
        width:100%;
        min-width:0;
        max-width:none;
        height:74px;
        padding:9px 12px;
    }

    #downloadArea,.panel{
        width:100%;
        max-width:100%;
        padding:12px;
        border-radius:14px;
    }

    .toolbar{
        width:100%;
        display:grid;
        grid-template-columns:1fr;
        gap:7px;
    }

    .toolbar input,.toolbar select{
        width:100%;
        min-width:0;
        height:38px;
    }

    .addrow{
        display:grid;
        grid-template-columns:1fr;
        gap:7px;
    }

    .addrow input,.name,.num{
        width:100%!important;
        min-width:0;
        max-width:none;
    }

    .controls,.actions,.saved-card-actions{
        flex-wrap:wrap;
    }

    .controls .btn,.actions .btn,.saved-card-actions .btn{
        flex:1 1 120px;
        min-width:0;
    }

    #profileName{
        max-width:calc(100vw - 100px);
        font-size:18px;
    }

    #profileTagline{
        max-width:calc(100vw - 100px);
    }

    .profile-text{
        max-width:calc(100% - 52px);
    }

    .saved-card-head{
        flex-wrap:wrap;
    }

    .saved-preview{
        max-width:100%;
    }

    /* Palette/control sections: never force a 190px desktop width. */
    .color-grid,.palette,.swatches{
        max-width:100%;
        overflow-x:auto;
    }
}

@media(max-width:380px){
    .stats{grid-template-columns:1fr;}
    .profile{grid-column:auto;}
    .profile-logo{flex:0 0 42px;}
    #profileName{max-width:calc(100vw - 82px);}
    #profileTagline{max-width:calc(100vw - 82px);}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="tag-page-top">
    <a id="tagSourceNavBtn" class="tag-nav-btn" href="/stats.html">📊 Live Stats</a>
    <a class="tag-nav-btn" href="/dashboard.html">🏠 Dashboard</a>
</div>

<div id="downloadArea">

<input
    id="listTitle"
    class="title"
    value="VALID LIST"
    onchange="saveListTitle()"
    onkeydown="if(event.key==='Enter') this.blur()"
>

<div class="stats">

  <div class="stat">
    <div class="label">Total Groups</div>
    <div class="value" id="totalGroups">0</div>
  </div>

  <div class="stat">
    <div class="label">Total Members</div>
    <div class="value" id="totalMembers">0</div>
  </div>

  <div class="stat country">
    <div class="label">Country</div>
    <input
        id="country"
        value="USA"
        oninput="resizeCountryInput()"
        onchange="saveDefaultCountry()"
    >
  </div>

  <div class="stat profile">
    <div class="label">Company</div>

    <div class="profile-content">

      <label
        class="profile-logo"
        title="Click to upload / change logo"
      >

        <img
          id="profileLogo"
          alt="Profile Logo"
        >

        <span id="profileLogoText">
          Upload<br>Logo
        </span>

        <input
          id="profileLogoInput"
          type="file"
          accept="image/*"
          onchange="uploadProfileLogo(event)"
        >

      </label>


      <div class="profile-text">

          <span
              id="profileName"
              onclick="editProfile()"
              title="Click to edit name"
          >WS PRIME</span>

          <span
              id="profileTagline"
              onclick="editTagline()"
              title="Click to edit tagline"
          >Build on Trust, Driven by Results</span>

      </div>

    </div>

  </div>

</div>

<div class="panel">

    <div class="toolbar">

        <input
            id="search"
            placeholder="Search group..."
            oninput="render()"
        >

        <select
            id="filter"
            onchange="countrySelected()"
        >
            <option value="">All Countries</option>
        </select>

    </div>

    <div id="tags" class="tags"></div>

</div>

</div>

<div class="controls">

 <button class="btn save" onclick="saveList()">
   💾 Save List
 </button>

 <button class="btn clear" onclick="clearAll()">
   🧹 Clear List
 </button>

 <button class="btn download" onclick="downloadList()">
   ⬇️ Download List
 </button>

<div class="color-picker-wrap">

    <button
        class="btn color-btn"
        onclick="toggleColorPalette()"
    >
        🎨 Tag Color
    </button>

    <div id="colorPalette" class="color-palette">

        <button class="color-option" data-color="#C62828" style="background:#b30202" onclick="selectTagColor('#b30202')"></button>
        <button class="color-option" data-color="#1565C0" style="background:#01169a" onclick="selectTagColor('#01169a')"></button>
        <button class="color-option" data-color="#00843D" style="background:#00813c" onclick="selectTagColor('#00813c')"></button>
        <button class="color-option" data-color="#D35400" style="background:#b34800" onclick="selectTagColor('#b34800')"></button>
        <button class="color-option" data-color="#212121" style="background:#212121" onclick="selectTagColor('#212121')"></button>
        <button class="color-option" data-color="#512DA8" style="background:#44258b" onclick="selectTagColor('#44258b')"></button>
        <button class="color-option" data-color="#AD1457" style="background:#99114c" onclick="selectTagColor('#99114c')"></button>
        <button class="color-option" data-color="#00796B" style="background:#00685c" onclick="selectTagColor('#00685c')"></button>
        <button class="color-option" data-color="#455A64" style="background:#374951" onclick="selectTagColor('#374951')"></button>
        <label class="custom-color-option" title="Custom color">

            <span>＋</span>

            <input
                id="customTagColor"
                type="color"
                onchange="selectTagColor(this.value)"
            >

        </label>

    </div>

</div>

 <button
 id="undoBtn"
 class="btn blue"
 onclick="undoDelete()"
 style="display:none;"
 >
 ↩ Undo
</button>

</div>

<div class="addrow">
 <input class="name" id="newName" placeholder="Enter group name">
 <input class="num" id="newMembers" type="number" min="0" placeholder="Members">
 <input class="num" id="newCountry" placeholder="Country">
 <button class="btn add" onclick="addGroup()">＋ Add</button>
</div>
<div id="status" class="status"></div>

<div class="backup-panel">
    <span class="backup-label">☁ Saved Tags Lists</span>
    <select id="savedTagList">
        <option value="">No saved lists</option>
    </select>
    <button class="btn blue" type="button" onclick="loadSelectedBackup()">Load</button>
    <button class="btn backup-save" type="button" onclick="saveBackup()">💾 Save Backup</button>
    <button class="btn backup-delete" type="button" onclick="deleteSelectedBackup()">🗑 Delete</button>
    <span class="backup-status" id="backupStatus">Not loaded</span>
</div>
<div id="savedBackupCards" class="saved-backup-cards" aria-live="polite"></div>

<div id="modal" class="modalbg">

  <div class="modal">

    <div class="modal-header">
      <h3>Edit Group</h3>

        <div class="edit-color-picker">

            <button
                type="button"
                class="btn edit-color-btn"
                onclick="toggleEditColorPalette()"
            >
                🎨 Color
            </button>

            <div
                id="editColorPalette"
                class="edit-color-palette"
            >

                <button class="edit-color-option" data-color="#C62828" style="background:#b30202" onclick="selectEditTagColor('#b30202')"></button>

try":"USA"},{"name":"Booking 限时推广 BF117","members":0,"country":"USA"}];
/* LIVE STATS → TAGS LIST import bridge
   Receives the current Live Stats tab (Pending / Invite links / Added / Total members)
   through same-origin sessionStorage, then hands the data to the existing Tags UI. */
let importedTagPayload = null;

/*
   Keep the Tags page tied to the section that opened it.
   The source is carried in the URL so a browser reload (including
   mobile Desktop-site switches) cannot silently fall back to Live Stats.
   sessionStorage remains the one-time hand-off for the initial dataset.
*/
const tagsSourceParam = new URLSearchParams(window.location.search).get('source');
let tagsListSource = tagsSourceParam === 'message-manager' ? 'message-manager' : 'stats';

try {
    const messageRaw = sessionStorage.getItem("waMessageTagsImport");
    const statsRaw = sessionStorage.getItem("waTagsImport");
    const messagePayload = messageRaw ? JSON.parse(messageRaw) : null;
    const statsPayload = statsRaw ? JSON.parse(statsRaw) : null;

    /*
       Only consume the payload belonging to the requested source.
       On later reloads the source stays in the URL and the persisted
       source-specific localStorage namespace is used instead.
    */
    if(tagsListSource === 'message-manager' && messagePayload && Array.isArray(messagePayload.groups)){
        importedTagPayload = messagePayload;
        sessionStorage.removeItem("waMessageTagsImport");
        sessionStorage.removeItem("waMessageTagsOpened");
    }else if(tagsListSource === 'stats' && statsPayload && Array.isArray(statsPayload.groups)){
        importedTagPayload = statsPayload;
        sessionStorage.removeItem("waTagsImport");
        sessionStorage.removeItem("waTagsOpenedFromStats");
    }
} catch(error){
    console.error("[tags-list] import failed:", error);
}

/* Keep the Tags page navigation tied to the section that opened it.
   Message Manager Tags must never show a misleading Live Stats switch.
   Live Stats Tags keep their existing Live Stats + Dashboard navigation. */
const tagSourceNavBtn = document.getElementById('tagSourceNavBtn');
if(tagSourceNavBtn && tagsListSource === 'message-manager'){
    tagSourceNavBtn.href = '/message-manager.html';
    tagSourceNavBtn.textContent = '💬 Message Manager';
}

const TAGS_DATA_KEY = tagsListSource === 'message-manager'
    ? 'groupManagerMessageTagsData'
    : 'groupManagerData';
const tagStorageKey = (key) =>
    tagsListSource === 'message-manager' ? `messageTags::${key}` : key;


let data = importedTagPayload
    ? importedTagPayload.groups.map(function(g){
        return {
            name: String(g.name || ""),
            members: Number(g.members || 0),
            country: String(g.country || ""),
            color: String(g.color || localStorage.getItem(tagStorageKey("tagColor")) || "#006b3c")
        };
    })
    : (JSON.parse(localStorage.getItem(TAGS_DATA_KEY)||"null")||(tagsListSource === 'message-manager' ? [] : defaults));

if(importedTagPayload){
    /* Persist only inside this source's namespace. */
    localStorage.setItem(TAGS_DATA_KEY, JSON.stringify(data));
}
let editIndex=-1;
let duplicatePending=null;

let deletedGroups = [];
let tagBackups = [];
let activeBackupName = '';
let backupReady = false;
let backupAutosaveTimer = null;
let currentUserId = '';
const LOCAL_SAVE_PREFIX = tagsListSource === 'message-manager' ? 'messageBrowserSaved::' : 'tagsBrowserSaved::';
const LOCAL_BACKUP_NAME = tagsListSource === 'message-manager' ? '__message_browser_saved__' : '__browser_saved__';

const apiJSON = async function(url, options){
    const response = await fetch(url, Object.assign({
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin'
    }, options || {}));
    let body = null;
    try { body = await response.json(); } catch {}
    if(!response.ok){
        const err = new Error(body?.error || `Request failed (${response.status})`);
        err.status = response.status;
        throw err;
    }
    return body;
};

function buildTagSnapshot(){
    return {
        version: 1,
        groups: data.map(function(g){
            return {
                name: String(g.name || ''),
                members: Number(g.members || 0),
                country: String(g.country || ''),
                color: String(g.color || localStorage.getItem(tagStorageKey('tagColor')) || '#006b3c')
            };
        }),
        listTitle: String($('listTitle')?.value || 'VALID LIST'),
        country: String($('country')?.value || ''),
        profileName: String($('profileName')?.textContent || ''),
        profileTagline: String($('profileTagline')?.textContent || ''),
        profileLogo: String($('profileLogo')?.getAttribute('src') || ''),
        tagColor: String(localStorage.getItem(tagStorageKey('tagColor')) || '#006b3c')
    };
}

function applyTagSnapshot(snapshot){
    if(!snapshot || !Array.isArray(snapshot.groups)) return false;
    data = snapshot.groups.map(function(g){
        return {
            name: String(g.name || ''),
            members: Number(g.members || 0),
            country: String(g.country || ''),
            color: String(g.color || snapshot.tagColor || '#006b3c')
        };
    });
    if($('listTitle')) $('listTitle').value = snapshot.listTitle || 'VALID LIST';
    if($('country')) $('country').value = snapshot.country || '';
    if($('profileName')) $('profileName').textContent = snapshot.profileName || 'WS PRIME';
    if($('profileTagline')) $('profileTagline').textContent = snapshot.profileTagline || 'Build on Trust, Driven by Results';
    if(snapshot.profileLogo){
        $('profileLogo').src = snapshot.profileLogo;
        $('profileLogo').style.display = 'block';
        $('profileLogoText').style.display = 'none';
    }else{
        $('profileLogo').removeAttribute('src');
        $('profileLogo').style.display = 'none';
        $('profileLogoText').style.display = 'block';
    }
    localStorage.setItem(TAGS_DATA_KEY, JSON.stringify(data));
    if(snapshot.listTitle) localStorage.setItem(tagStorageKey('listTitle'), snapshot.listTitle);
    if(snapshot.country) localStorage.setItem(tagStorageKey('defaultCountry'), snapshot.country);
    if(snapshot.profileName) localStorage.setItem(tagStorageKey('profileName'), snapshot.profileName);
    if(snapshot.profileTagline) localStorage.setItem(tagStorageKey('profileTagline'), snapshot.profileTagline);
    if(snapshot.profileLogo) localStorage.setItem(tagStorageKey('profileLogo'), snapshot.profileLogo);
    if(snapshot.tagColor) localStorage.setItem(tagStorageKey('tagColor'), snapshot.tagColor);
    render();
    updateSelectedColor();
    resizeCountryInput();
    return true;
}

function getLocalSaveKey(){
    return currentUserId ? LOCAL_SAVE_PREFIX + String(currentUserId) : '';
}

function readLocalSavedList(){
    const key=getLocalSaveKey();
    if(!key) return null;
    try{
        const raw=localStorage.getItem(key);
        if(!raw) return null;
        const parsed=JSON.parse(raw);
        return parsed && parsed.snapshot ? parsed : null;
    }catch(e){
        console.error('[tags-local-save] read:', e);
        return null;
    }
}

function writeLocalSavedList(snapshot){
    const key=getLocalSaveKey();
    if(!key) throw new Error('Please log in before saving this list.');
    const record={
        name: LOCAL_BACKUP_NAME,
        updatedAt: Date.now(),
        snapshot: snapshot
    };
    try{
        localStorage.setItem(key, JSON.stringify(record));
        return record;
    }catch(e){
        console.error('[tags-local-save] write:', e);
        throw new Error('Browser storage is full. Please remove some old saved browser data and try again.');
    }
}

function deleteLocalSavedList(){
    const key=getLocalSaveKey();
    if(key) localStorage.removeItem(key);
}

function renderBackupOptions(){
    const select = $('savedTagList');
    if(!select) return;
    select.innerHTML = '';

    const local=readLocalSavedList();
    if(local){
        const o=document.createElement('option');
        o.value=LOCAL_BACKUP_NAME;
        o.textContent='💻 Browser Saved List (Offline) · ' + new Date(local.updatedAt).toLocaleString();
        select.appendChild(o);
    }

    if(!tagBackups.length && !local){
        const o=document.createElement('option');
        o.value=''; o.textContent='No saved lists'; select.appendChild(o);
        return;
    }

    tagBackups.forEach(function(b){
        const o=document.createElement('option');
        o.value=b.name;
        const d=b.updatedAt ? new Date(b.updatedAt).toLocaleString() : '';
        o.textContent=b.name + (d ? ' · ' + d : '');
        select.appendChild(o);
    });

    if(activeBackupName && tagBackups.some(b=>b.name===activeBackupName)){
        select.value=activeBackupName;
    }else if(local){
        select.value=LOCAL_BACKUP_NAME;
    }

    renderSavedBackupCards();
}

function renderSavedBackupCards(){
    const box = $('savedBackupCards');
    if(!box) return;
    if(!tagBackups.length){
        box.innerHTML='<div class="saved-empty">No account-saved Tags Lists yet. Click <b>Save Backup</b> to keep the current list in your profile.</div>';
        return;
    }
    box.innerHTML = tagBackups.map((b, i) => {
        const groups = Array.isArray(b.snapshot?.groups) ? b.snapshot.groups : [];
        const preview = groups.slice(0, 5).map(g => String(g?.name || '')).filter(Boolean);
        const date = b.updatedAt ? new Date(b.updatedAt).toLocaleString() : '';
        return `<div class="saved-card">
          <div class="saved-card-head"><div><strong>${esc(b.name)}</strong><div class="saved-meta">${groups.length} groups${date ? ' · Updated ' + esc(date) : ''}</div></div><span class="saved-dot">✓ Saved</span></div>
          <div class="saved-preview">${preview.length ? preview.map(esc).join(' · ') + (groups.length > preview.length ? ` · +${groups.length-preview.length} more` : '') : 'Empty list'}</div>
          <div class="saved-card-actions"><button class="btn blue" type="button" data-load-backup="${i}">Load & Edit</button><button class="btn backup-delete" type="button" data-delete-backup="${i}">Delete</button></div>
        </div>`;
    }).join('');
}

document.getElementById('savedBackupCards')?.addEventListener('click', async function(e){
    const load=e.target.closest('[data-load-backup]');
    const del=e.target.closest('[data-delete-backup]');
    if(load){
        const backup=tagBackups[Number(load.dataset.loadBackup)];
        if(!backup) return;
        if(!confirm(`Load saved Tags List "${backup.name}"? Your current unsaved changes will be replaced.`)) return;
        if(applyTagSnapshot(backup.snapshot)){
            activeBackupName=backup.name;
            try{ writeLocalSavedList(backup.snapshot); }catch(err){ console.warn(err); }
            $('savedTagList').value=backup.name;
            $('backupStatus').textContent='Loaded from your account · ready to edit';
            renderBackupOptions();
        }
    }
    if(del){
        const backup=tagBackups[Number(del.dataset.deleteBackup)];
        if(!backup) return;
        if(!confirm(`Delete saved Tags List "${backup.name}"? This cannot be undone.`)) return;
        try{
            const result=await apiJSON('/api/tag-backups/delete',{method:'POST',body:JSON.stringify({name:backup.name, source:tagsListSource})});
            tagBackups=Array.isArray(result.backups)?result.backups:[];
            if(activeBackupName===backup.name) activeBackupName='';
            renderBackupOptions();
            $('backupStatus').textContent='Saved list deleted';
        }catch(err){ alert(err.message || 'Could not delete saved list.'); }
    }
});

async function getCurrentUserForTags(){
    try{
        const me=await apiJSON('/api/me');
        if(me?.loggedIn && me.user?.id){
            currentUserId=String(me.user.id);
            localStorage.setItem(tagStorageKey('tagsLastUserId'), currentUserId);
            return currentUserId;
        }
        currentUserId='';
        return '';
    }catch(e){
        // Offline fallback: use the last profile ID only for browser-local data.
        currentUserId=localStorage.getItem(tagStorageKey('tagsLastUserId')) || '';
        return currentUserId;
    }
}

async function loadBackups(){
    currentUserId=await getCurrentUserForTags();
    if(!currentUserId){
        $('backupStatus').textContent='Login required';
        renderBackupOptions();
        return;
    }

    try{
        const result = await apiJSON('/api/tag-backups?source=' + encodeURIComponent(tagsListSource), { method:'GET' });
        tagBackups = Array.isArray(result.backups) ? result.backups : [];
        backupReady = true;
        renderBackupOptions();
        $('backupStatus').textContent = tagBackups.length
            ? `${tagBackups.length} saved list${tagBackups.length===1?'':'s'} · browser copy available offline`
            : (readLocalSavedList()
                ? (tagsListSource==='message-manager' ? 'Message Tags browser copy available offline' : 'Browser saved copy available offline')
                : 'No saved lists yet');
    }catch(e){
        console.error('[tag-backups]', e);
        tagBackups=[];
        backupReady=true;
        renderBackupOptions();
        $('backupStatus').textContent = readLocalSavedList()
            ? (tagsListSource==='message-manager'
                ? 'Message Tags cloud backup unavailable · browser copy is available offline'
                : 'Cloud backup unavailable · browser copy is available offline')
            : (tagsListSource==='message-manager'
                ? 'Message Tags cloud backup unavailable · Save will use browser storage'
                : 'Cloud backup unavailable · Save will use browser storage');
    }
}

async function saveBackup(){
    /*
       Every explicit Save Backup action creates a NEW history entry.
       Loading an old backup and editing it must never overwrite the old entry.
       This behavior is intentionally limited to Message Manager; Live Stats
       keeps its existing save behavior unchanged.
    */
    if(tagsListSource === 'message-manager'){
        const groupCount = Array.isArray(data) ? data.length : 0;
        const suggested = `Message Tags - ${groupCount} groups - ${new Date().toLocaleString()}`;
        let name = prompt('Enter a name for this Tags List backup:', suggested);
        if(name===null) return;
        name = name.trim();
        if(!name){ alert('Please enter a backup name.'); return; }
        await saveBackupWithName(name, { createNew: true });
        return;
    }

    let name = activeBackupName;
    if(!name){
        name = prompt('Enter a name for this Tags List backup:', 'My Tags List');
        if(name===null) return;
        name = name.trim();
        if(!name){ alert('Please enter a backup name.'); return; }
    }
    await saveBackupWithName(name);
}

function makeUniqueMessageBackupName(name){
    const base = String(name || '').trim();
    if(!base) return '';
    const names = new Set(tagBackups.map(function(b){ return String(b?.name || '').trim().toLowerCase(); }));
    if(!names.has(base.toLowerCase())) return base;

    let n = 2;
    let candidate = `${base} (${n})`;
    while(names.has(candidate.toLowerCase())){
        n += 1;
        candidate = `${base} (${n})`;
    }
    return candidate;
}

async function saveBackupWithName(name, options){
    if(tagsListSource==='message-manager'){
        if(!currentUserId) currentUserId=await getCurrentUserForTags();
        if(!currentUserId){
            alert('Please log in to save this Message Tags List.');
            return;
        }

        const createNew = options?.createNew === true;
        const backupName = createNew ? makeUniqueMessageBackupName(name) : String(name || '').trim();
        if(!backupName){
            alert('Please enter a backup name.');
            return;
        }

        const snapshot=buildTagSnapshot();
        try{
            const result=await apiJSON('/api/tag-backups',{
                method:'POST',
                body:JSON.stringify({name:backupName, snapshot:snapshot, source:'message-manager', createNew:createNew})
            });
            tagBackups=Array.isArray(result.backups)?result.backups:[];
            activeBackupName=createNew ? backupName : backupName;
            renderBackupOptions();
            $('backupStatus').textContent='Message Tags saved as a new history entry';
            try{ writeLocalSavedList(snapshot); }catch(localError){ console.warn(localError); }
        }catch(e){
            try{
                writeLocalSavedList(snapshot);
                activeBackupName='';
                renderBackupOptions();
                $('backupStatus').textContent='Server backup unavailable · Message Tags saved in browser offline';
                alert('Server backup unavailable, so the Message Tags List was saved safely in this browser instead.');
            }catch(localError){
                alert(e.message || localError.message || 'Could not save Message Tags List.');
            }
        }
        return;
    }
    if(!currentUserId) currentUserId=await getCurrentUserForTags();
    if(!currentUserId){
        alert('Please log in to save a Tags List backup.');
        return;
    }

    const snapshot=buildTagSnapshot();
    try{
        const result=await apiJSON('/api/tag-backups',{
            method:'POST',
            body:JSON.stringify({name, snapshot:snapshot})
        });
        tagBackups=Array.isArray(result.backups)?result.backups:[];
        activeBackupName=name;
        renderBackupOptions();
        $('backupStatus').textContent='Saved to your account + browser offline copy';
        // Keep a local emergency copy of the currently active backup too.
        try{ writeLocalSavedList(snapshot); }catch(localError){ console.warn(localError); }
    }catch(e){
        // A 404 usually means the running server is an older build. Save locally so
        // the user's list is still protected instead of showing a failed-save state.
        try{
            writeLocalSavedList(snapshot);
            activeBackupName='';
            renderBackupOptions();
            $('backupStatus').textContent='Server backup unavailable · saved in browser offline';
            alert('Server backup endpoint is unavailable, so the list was saved safely in this browser instead. It will remain available for this profile.');
        }catch(localError){
            alert(e.message || localError.message || 'Could not save backup.');
        }
    }
}

async function loadSelectedBackup(){
    const name=$('savedTagList')?.value || '';
    if(name===LOCAL_BACKUP_NAME){
        const local=readLocalSavedList();
        if(!local) return;
        if(!confirm('Load your browser-saved Tags List? Your current unsaved changes will be replaced.')) return;
        if(applyTagSnapshot(local.snapshot)){
            activeBackupName='';
            $('backupStatus').textContent='Loaded from browser storage (offline available)';
            renderBackupOptions();
        }
        return;
    }
    const backup=tagBackups.find(b=>b.name===name);
    if(!backup) return;
    if(!confirm(`Load saved Tags List "${name}"? Your current unsaved changes will be replaced.`)) return;
    if(applyTagSnapshot(backup.snapshot)){
        activeBackupName=name;
        try{ writeLocalSavedList(backup.snapshot); }catch(e){ console.warn(e); }
        $('backupStatus').textContent='Loaded from your account';
        renderBackupOptions();
    }
}

async function deleteSelectedBackup(){
    const name=$('savedTagList')?.value || '';
    if(!name) return;
    if(name===LOCAL_BACKUP_NAME){
        if(!confirm('Delete the browser-saved offline copy?')) return;
        deleteLocalSavedList();
        renderBackupOptions();
        $('backupStatus').textContent='Browser offline copy deleted';
        return;
    }
    if(!confirm(`Delete saved Tags List "${name}"? This cannot be undone.`)) return;
    try{
        const result=await apiJSON('/api/tag-backups/delete',{
            method:'POST',
            body:JSON.stringify({name, source:tagsListSource})
        });
        tagBackups=Array.isArray(result.backups)?result.backups:[];
        if(activeBackupName===name) activeBackupName='';
        renderBackupOptions();
        $('backupStatus').textContent='Backup deleted';
    }catch(e){
        // If the server copy cannot be reached, don't pretend it was deleted remotely.
        alert(e.message || 'Could not delete backup.');
    }
}

function queueBackupAutosave(){
    if(!backupReady || !currentUserId) return;
    clearTimeout(backupAutosaveTimer);
    backupAutosaveTimer=setTimeout(function(){
        try{ writeLocalSavedList(buildTagSnapshot()); }catch(e){ console.warn('[tags-local-save]',e); }

        /*
           Do not silently rewrite an existing Message Manager history entry
           when the current list is edited. A new history entry is created
           only when the user explicitly presses Save Backup.
           Live Stats behavior remains unchanged.
        */
        if(tagsListSource !== 'message-manager' && activeBackupName){
            saveBackupWithName(activeBackupName).catch(function(){});
        }
    },1200);
}

function addGroup(){

    const name = $("newName").value.trim();

    if(!name){
        msg("Enter a group name.");
        return;
    }

    const memberInput = $("newMembers").value.trim();

    const country =
        $("newCountry").value.trim() ||
        $("country").value.trim() ||
        "USA";

    const newGroup = {

        name: name,

        members:
            memberInput === ""
                ? ""
                : Number(memberInput),

        country: country,

        color:
            localStorage.getItem(tagStorageKey("tagColor")) ||
            "#006b3c"
    };


    // Check duplicate group
    const duplicate = data.some(function(g){

        return (
            String(g.name).trim().toLowerCase() ===
            name.toLowerCase()
        );

    });


    // If duplicate exists, show popup
    if(duplicate){

        duplicatePending = newGroup;

        $("duplicateModal").style.display = "flex";

        return;
    }


    // Normal add
    data.push(newGroup);

    $("newName").value = "";
    $("newMembers").value = "";
    $("newCountry").value = "";

    saveData();
    render();

    $("newName").focus();

    msg("Group added.");
}

["newName", "newMembers", "newCountry"].forEach(function(id){

    $(id).addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            event.stopPropagation();

            // If duplicate popup is already open,
            // Enter means ADD
            if($("duplicateModal").style.display === "flex"){

                addDuplicate();

                return;
            }

            // Otherwise try to add the group

        }

    });

});


function addDuplicate(){

    }

    duplicatePending = null;

    $("duplicateModal").style.display = "none";

function removeGroup(i){

    if(i < 0 || i >= data.length){
        return;
    }

    // Save deleted group + original position
    deletedGroups.push({
        group: data[i],
        index: i
    });

    // Remove group
    data.splice(i, 1);

    saveData();
    render();

    // Show Undo button
    $("undoBtn").style.display = "inline-block";

    msg("Group deleted. Click Undo to restore.");
}


function undoDelete(){

    // Nothing to restore
    if(deletedGroups.length === 0){
        $("undoBtn").style.display = "none";
        return;
    }

    // Get the most recent deleted action
    const lastDeleted = deletedGroups.pop();

    // If the last action was Clear List
    if(lastDeleted.type === "clear"){

        // Restore the complete list
        data = [...lastDeleted.groups];

        saveData();
        render();

        msg("All groups restored.");

    }else{

        // Normal single-group delete
        data.splice(
            lastDeleted.index,
            0,
            lastDeleted.group
        );

        saveData();
        render();

        msg("Group restored.");
    }

    // Hide Undo button when nothing is left to undo
    if(deletedGroups.length === 0){
        $("undoBtn").style.display = "none";
    }else{
        $("undoBtn").style.display = "inline-block";
    }
}

async function downloadList(){

    if(!data.length){
        alert("There is no group list to download.");
        return;
    }

    const area = $("downloadArea");

    if(!area){
        alert("Download area not found.");
        return;
    }

    try{

        /* Create a temporary copy for downloading */
        const clone = area.cloneNode(true);

        /* Convert title INPUT into normal text */
        const originalTitle = clone.querySelector("#listTitle");

        if(originalTitle){

            const titleBox = document.createElement("div");

            titleBox.textContent = originalTitle.value;

            titleBox.style.display = "block";
            titleBox.style.width = "100%";
            titleBox.style.textAlign = "center";
            titleBox.style.fontFamily = '"Segoe UI", Arial, sans-serif';
            titleBox.style.fontSize = "30px";
            titleBox.style.fontWeight = "700";
            titleBox.style.letterSpacing = "0.4px";
            titleBox.style.color = "#1f2937";
            titleBox.style.margin = "5px 0 16px";
            titleBox.style.lineHeight = "1.2";
            titleBox.style.padding = "0";
            titleBox.style.height = "36px";
            titleBox.style.boxSizing = "border-box";

            originalTitle.replaceWith(titleBox);
        }

        /* Put clone outside the visible page */
        clone.style.position = "absolute";
        clone.style.left = "-100000px";
        clone.style.top = "0";
        clone.style.width = area.offsetWidth + "px";
        clone.style.background = "#fff";
        clone.style.margin = "0";
        clone.style.padding = "0";

        document.body.appendChild(clone);

        /* Allow browser to render the clone */
        await new Promise(function(resolve){
            requestAnimationFrame(function(){
                requestAnimationFrame(resolve);
            });
        });

        const canvas = await html2canvas(clone, {

            scale: 3,

            backgroundColor: "#ffffff",

            useCORS: true,

            allowTaint: false,

            logging: false,

            imageTimeout: 0,

            scrollX: 0,

            scrollY: 0,

            width: clone.offsetWidth,

            height: clone.scrollHeight,

            windowWidth: clone.offsetWidth,

            windowHeight: clone.scrollHeight
        });

        /* Remove temporary clone */
        document.body.removeChild(clone);

        const link = document.createElement("a");

        const date = new Date();

        const fileName =
            "Groups-List-" +
            date.getFullYear() + "-" +
            String(date.getMonth()+1).padStart(2,"0") + "-" +
            String(date.getDate()).padStart(2,"0") +
            ".png";

        link.download = fileName;

        link.href = canvas.toDataURL(
            "image/png",
            1.0
        );

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        msg("HD list image downloaded.");

    }catch(error){

        console.error(error);

        alert(
            "Image download failed. Please try again."
        );
    }
}
